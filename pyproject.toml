[project]
name = "verdantflare-app-google"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["starlette==0.48.0", "uvicorn==0.40.0", "httpx==0.28.1", "cryptography==46.0.3"]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["google_channel*"]
